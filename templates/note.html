<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notes</title>
</head>
<body>
<form method="post">
  <label for="note"></label>
  <input type="text" name="note" id="note">
  <input type="submit" name="submit" id="submit" value="Add">
</form>

{% if mynote %}
  <ul>
    {% for notes in mynote %}
      <li>{{ notes }}</li>
    {% endfor %}
  </ul>
{% else %}
  <p>Error</p>
{% endif %}
</body>
</html>
